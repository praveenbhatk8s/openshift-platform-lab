# The stock nginx image from Docker Hub. It works on most Kubernetes clusters and fails on
# OpenShift: it expects to run as root, write to /var/cache/nginx and listen on port 80.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-dockerhub
  labels:
    app: nginx-dockerhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-dockerhub
  template:
    metadata:
      labels:
        app: nginx-dockerhub
    spec:
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.27
          ports:
            - containerPort: 80
