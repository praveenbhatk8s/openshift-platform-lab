apiVersion: apps/v1
kind: Deployment
metadata:
  name: rack-web
  labels:
    app: rack-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rack-web
  template:
    metadata:
      labels:
        app: rack-web
    spec:
      containers:
        - name: nginx
          image: registry.access.redhat.com/ubi9/nginx-124:latest
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
